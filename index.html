<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>xArm 5 Chessboard Simulator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="pip">
        <span class="pip-label">Wrist cam · J4</span>
      </div>

      <div id="panel">
        <h1>xArm 5 Chessboard Sim</h1>
        <p class="hint">
          Drag to orbit &middot; scroll/pinch to zoom. Click a piece to pick it up,
          then click a square to place it. The gripper stays vertical.
        </p>

        <section>
          <h2>Joints</h2>
          <div id="sliders"></div>
        </section>

        <section>
          <h2>Target (meters)</h2>
          <div class="targets">
            <label>X <input id="tx" type="number" step="0.01" value="0.10" /></label>
            <label>Y <input id="ty" type="number" step="0.01" value="0.08" /></label>
            <label>Z <input id="tz" type="number" step="0.01" value="0.15" /></label>
          </div>
          <div class="buttons">
            <button id="move">Move to target</button>
            <button id="reset" class="secondary">Reset pose</button>
          </div>
        </section>

        <section>
          <h2>Status</h2>
          <div class="readout">
            <div>End effector: <span id="ee">–</span></div>
            <div id="solver" class="solver">Idle</div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
